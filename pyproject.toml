[project]
name = "api-client"
version = "1.0.0"
description = "A lightweight desktop REST client for backend (Spring Boot) developers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.6"]

[project.gui-scripts]
api-client = "app.bootstrap:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108"]
