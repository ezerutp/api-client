# Builds the Windows installer and the Linux archive, and publishes them as a GitHub
# release when a version tag is pushed:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag must match APP_VERSION in app/__init__.py and the version in pyproject.toml.
# Running the workflow by hand (Actions > Release > Run workflow) only builds both
# packages and keeps them as workflow artifacts, without creating a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: read
        name: Check that the tag matches the app version
        run: |
          app_version=$(python -c "from app import APP_VERSION; print(APP_VERSION)")
          project_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$app_version" != "$project_version" ]; then
            echo "::error::app/__init__.py says $app_version but pyproject.toml says $project_version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version v$app_version"
            exit 1
          fi
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # The oldest supported runner: the bundle only runs on the same or a newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries bundled with Qt
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0
      - name: Build
        run: PYTHON=python packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist_installer/api-client-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist_installer/api-client-setup.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "API Client ${{ needs.version.outputs.version }}" \
            --generate-notes
